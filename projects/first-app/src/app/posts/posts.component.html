<!-- simple callback -->
{{ posts | json }}
<br><br>
<hr>
<br>

<!-- with table -->
<table>
    <tr>
        <th>Id</th>
        <th>Title</th>
    </tr>
    <tr *ngFor="let post of posts">
        <td>{{ post.id }}</td>
        <td>{{ post.title }}</td>
    </tr>
</table>
<br>
<hr>

{{ users | json }}
<br>
<hr>
<table>
    <tr>
        <th>Id</th>
        <th>Name</th>
    </tr>
    <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
    </tr>
</table>
<br>
<hr>
<br>
{{ persons | json }}
<br>
<hr>
<div *ngFor="let person of persons">
    <p>Name: {{ person.name }}</p>
    <p>Address: {{ person.address.street }}, {{ person.address.city }}</p>
    <ul>
        <li *ngFor="let skill of person.skills">{{ skill }}</li>
    </ul>
</div>
