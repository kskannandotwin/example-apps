<h2>My Villains</h2>

<ul class="heroes">
    <li *ngFor="let villain of villains">
        <button [class.selected]="villain === selectedVillain" type="button" (click)="onSelect(villain)">
            <span class="badge">{{ villain.id }}</span>
            <span class="name">{{ villain.name }}</span>
        </button>
    </li>
</ul>

<app-villain-detail [villain]="selectedVillain"></app-villain-detail>
