<h2>My Villains</h2>
<ul class="heroes">
    <li *ngFor="let villain of villains">
        <button [class.selected]="villain === selectedVillain" type="button" (click)="onSelect(villain)">
            <span class="badge">{{ villain.id }}</span>
            <span class="name">{{ villain.name }}</span>
        </button>
    </li>
</ul>

<div *ngIf="selectedVillain">
    <h2>{{ selectedVillain.name | uppercase }} Details</h2>    
    <div>id:{{ selectedVillain.id }}</div>
    <div>
        <label for="villain-name">Villain name:</label>
        <input id="villain-name" [(ngModel)]="selectedVillain.name" placeholder="Villain name">
    </div>
</div>
