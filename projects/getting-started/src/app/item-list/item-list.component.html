<div *ngFor="let item of items">
    <h3>
        <a [title]="item.name + ' details'" [routerLink]="['/items', item.id]">{{ item.name }}</a>
    </h3>
    <p *ngIf="item.description">
        {{ item.description }}
    </p>
    <button type="button" (click)="share()">Share</button>
    <app-item-alerts [item]="item" (click)="onNotify()"></app-item-alerts>
</div>
