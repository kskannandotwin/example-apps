<app-app-bar></app-app-bar>
<router-outlet></router-outlet>

<h3>Http Request</h3>
<p>The sample api call without service through main component</p>
<table width="100%">
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>User Id</th>
        <th>Status</th>
    </tr>
    <tr *ngFor="let datas of httpData">
        <td>{{datas.id}}</td>
        <td>{{datas.title}}</td>
        <td>{{datas.userId}}</td>
        <td>{{datas.completed}}</td>
    </tr>
</table>
