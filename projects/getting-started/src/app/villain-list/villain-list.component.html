<h2>Villain List</h2>

<p><em>Select a villain from the list to see details.</em></p>
<ul>
    <li *ngFor="let villain of villains">
        <button type="button" (click)="selectVillain(villain)">
            {{villain.name}}
        </button>
    </li>
</ul>

<app-villain-detail *ngIf="selectedVillain" [villain]="selectedVillain"></app-villain-detail>
